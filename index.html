<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ToCX JAM</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b0b14; touch-action:none; overscroll-behavior:none; }
  #wrap { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  #rotate {
    position:fixed; inset:0; z-index:50; display:none;
    background:#0b0b14; color:#fff; text-align:center;
    font-family:'Courier New', monospace; font-weight:bold;
    align-items:center; justify-content:center; flex-direction:column; gap:16px;
  }
  #rotate .phone { font-size:64px; animation:spin 1.6s ease-in-out infinite; }
  @keyframes spin { 0%,20% { transform:rotate(0deg);} 60%,100% { transform:rotate(90deg);} }
  @media (orientation: portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="rotate">
  <div class="phone">📱</div>
  <div>ROTATE YOUR PHONE<br>TO PLAY ToCX JAM</div>
</div>
<script src="js/characters.js"></script>
<script src="js/game.js"></script>
</body>
</html>
